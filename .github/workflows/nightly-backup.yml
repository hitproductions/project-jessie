# Nightly backup of the live n8n workflows into this repo.
#
# Runs on GitHub's own servers, so it does not depend on anyone's laptop being on.
# Every night it reads all the workflows from the live n8n instance and, if
# anything changed since yesterday, commits the new copy. With one shared n8n
# login and no restorable history on the free plan, this repo is the only way
# back if a workflow is broken or deleted.
#
# One-time setup (needs the repo owner's GitHub login, so a person does this):
#   Repo -> Settings -> Secrets and variables -> Actions
#     Secrets tab:   New secret    N8N_API_KEY  = <an n8n API key>
#     Variables tab: New variable  N8N_BASE_URL = https://signal.hitpromanila.net
# The key is stored encrypted and never appears in the logs or the repo.

name: Nightly n8n backup

on:
  schedule:
    # The instance has gone unreachable to the outside world for hours at a time,
    # clustered overnight-to-midday Manila (PENDING 15). GitHub also delays cron by
    # an hour or two. So run twice, both landing in the afternoon/evening Manila even
    # when delayed, well clear of that window - whichever hits a live moment backs up,
    # the other skips cleanly.
    - cron: '0 6 * * *'    # 06:00 UTC = 14:00 Manila
    - cron: '0 12 * * *'   # 12:00 UTC = 20:00 Manila
  workflow_dispatch: {}     # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot the live workflows
        env:
          N8N_API_KEY:  ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: ${{ vars.N8N_BASE_URL }}
        run: ./scripts/backup-live

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "n8n backup bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- workflows/live; then
            echo "no changes since the last backup"
          else
            git add workflows/live
            git commit -m "Nightly backup of the live n8n workflows ($(date -u +%Y-%m-%d))"
            git push
          fi
